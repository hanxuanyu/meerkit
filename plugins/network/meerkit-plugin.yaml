# yaml-language-server: $schema=../manifest.schema.json
schema_version: 1
id: meerkit.network
name: Meerkit Network
version: 1.0.0
vendor: Meerkit
desp: 提供 HTTP、TCP、DNS、TLS 证书和 ICMP 网络监控能力。
url: https://github.com/hanxuanyu/meerkit
protocol:
  min: 1
  max: 1
modules:
  - type: http
    name: HTTP
    version: "1"
    config_version: "1"
    result_schema_version: "1"
  - type: tcp
    name: TCP
    version: "1"
    config_version: "1"
    result_schema_version: "1"
  - type: dns
    name: DNS
    version: "1"
    config_version: "1"
    result_schema_version: "1"
  - type: tls-certificate
    name: TLS 证书
    version: "1"
    config_version: "1"
    result_schema_version: "1"
  - type: icmp
    name: ICMP 连通性
    version: "1"
    config_version: "1"
    result_schema_version: "1"
runtime:
  mode: direct
  args: []
artifacts: []
