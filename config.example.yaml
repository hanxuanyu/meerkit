server:
    address: 0.0.0.0
    port: 8080
storage:
    data_dir: ./data
logging:
    file:
        directory: ./logs
        filename: meerkit.log
        max_size_mb: 100
        max_backups: 7
        max_age_days: 30
        compress: true
        access:
            filename: meerkit-access.log
security:
    master_key_file: ./data/master.key
plugins:
    source_dir: ./plugins
    trusted_keys: {}
