<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meerkit Browser Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options-page">
  <main class="options-shell">
    <header><span class="brand-mark"><img src="icons/meerkit.png" alt=""></span><div><h1>Meerkit Browser Agent</h1><p>配置浏览器执行节点与 Meerkit 的连接。</p></div></header>
    <form id="settings-form">
      <label><span>WebSocket 地址</span><input id="endpoint" type="url" required placeholder="ws://127.0.0.1:8080/api/v1/browser/extension/ws"></label>
      <label><span>配对令牌</span><div class="password-field"><input id="pairing-token" type="password" required autocomplete="off"><button id="toggle-token" type="button" title="显示配对令牌" aria-label="显示配对令牌">显示</button></div></label>
      <div class="field-grid"><label><span>执行节点名称</span><input id="agent-name" type="text" maxlength="80" required></label><label><span>最大并发任务</span><input id="max-concurrent" type="number" min="1" max="8" required></label></div>
      <div id="status" class="status" data-state="idle"><span></span><strong>未连接</strong></div>
      <footer><button id="connection-toggle" class="secondary" type="button">连接后端</button><button class="primary" type="submit">保存设置</button></footer>
    </form>
  </main>
  <script src="modules/config.js"></script>
  <script src="options.js"></script>
</body>
</html>
