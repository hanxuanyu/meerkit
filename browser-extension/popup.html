<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meerkit Browser Agent</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup-page">
  <main class="popup-shell">
    <header><span class="brand-mark"><img src="icons/meerkit.png" alt=""></span><div><h1>Browser Agent</h1><p id="agent-name">Meerkit</p></div></header>
    <section id="popup-status" class="popup-status" data-state="idle"><span></span><div><strong>未连接</strong><small id="endpoint"></small></div></section>
    <dl><div><dt>版本</dt><dd id="version">-</dd></div><div><dt>运行任务</dt><dd id="active-runs">0</dd></div></dl>
    <section id="popup-debug" class="popup-debug" data-enabled="false">
      <div class="popup-debug-heading"><span><strong>元素调试</strong><small id="debug-tab">正在读取活动标签页</small></span><label class="popup-switch" title="切换元素调试模式"><input id="debug-mode" type="checkbox"><span></span></label></div>
      <p id="debug-description">开启后悬浮预览，单击元素固定后可复制选择器。</p>
    </section>
    <footer><button id="connection-toggle" class="secondary" type="button">连接后端</button><button id="settings" class="primary" type="button">连接设置</button></footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
